default_stages: [pre-commit]

repos:
  # 1) Formatter check-only: YAPF
  - repo: local
    hooks:
      - id: yapf-check
        name: "yapf: check format (no auto-fix)"
        entry: yapf --diff --style .style.yapf
        language: python
        additional_dependencies: ["yapf==0.43.0"]
        types: [python]
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)

  # 2) Linter: Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
    
     # 3) Logic basic: Pylint nested blocks
  - repo: https://github.com/pycqa/pylint
    rev: v3.2.7
    hooks:
      - id: pylint
        args:
          - "--init-hook=import sys; sys.path.insert(0, '.')"
          - "--disable=all"
          - "--enable=R1702,R0912,R0915,E,F"
          - "--max-nested-blocks=5"
          - "--max-branches=12"
          - "--max-statements=50"

        additional_dependencies:
          - pytest
          - pyyaml
          - flask
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)


   # 4) Secret scan staged
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: "gitleaks (staged)"
        entry: bash -lc "gitleaks protect --staged --redact --verbose --config .gitleaks.toml"
        language: system


    # 5) Custom rules (team)
  - repo: local
    hooks:
      - id: check-no-print
        name: "custom: forbid print() in production"
        entry: python tools/local-gate/check_no_print.py --config tools/local-gate/rules.yaml
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        types: [python]
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)

      - id: check-max-nested
        name: "custom: không quá 3 mức if/for/while lồng"
        entry: python tools/local-gate/check_max_nested.py
        language: python
        types: [python]
        exclude: "tests/|tools/local-gate/"
        args: ["--config=tools/local-gate/rules.yaml", "--max-depth=2"]  # ← THÊM


  # 6) Unit test pre-push (nếu muốn)
  - repo: local
    hooks:
      - id: pytest-pre-push
        name: "🧪 pytest - chỉ test app có thay đổi"
        entry: |
          echo "=== SMART TEST RUNNER ==="
          
          # Lấy file thay đổi so với origin/main
          FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || echo "")
          
          if [ -z "$FILES" ]; then
            echo "✅ Không có file nào thay đổi"
            exit 0
          fi
          
          # Tìm app có tests từ file thay đổi
          APPS=""
          while IFS= read -r FILE; do
            APP=$(echo "$FILE" | cut -d'/' -f1)
            if [ -d "$APP/tests" ]; then
              if [[ ! " $APPS " =~ " $APP " ]]; then
                APPS="$APPS $APP"
              fi
            fi
          done <<< "$FILES"
          
          if [ -z "$APPS" ]; then
            echo "✅ Không có app nào cần test"
            exit 0
          fi
          
          echo "📁 App cần test:$APPS"
          
          # Chạy test từng app
          for APP in $APPS; do
            echo ""
            echo "🧪 Testing $APP..."
            python3 -m pytest "$APP/" -q --tb=short || exit 1
          done
          
          echo "✅ Tất cả tests passed!"
        language: system
        pass_filenames: false
        stages: [pre-push]
 
