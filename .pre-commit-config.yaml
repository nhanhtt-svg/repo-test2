default_stages: [pre-commit]

repos:
  # 1) Formatter check-only: YAPF
  - repo: local
    hooks:
      - id: yapf-check
        name: "yapf: check format (no auto-fix)"
        entry: yapf --diff --style .style.yapf
        language: python
        additional_dependencies: ["yapf==0.43.0"]
        types: [python]
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)

  # 2) Linter: Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
    
     # 3) Logic basic: Pylint nested blocks
  - repo: https://github.com/pycqa/pylint
    rev: v3.2.7
    hooks:
      - id: pylint
        args:
          - "--init-hook=import sys; sys.path.insert(0, '.')"
          - "--disable=all"
          - "--enable=R1702,R0912,R0915,E,F"
          - "--max-nested-blocks=5"
          - "--max-branches=12"
          - "--max-statements=50"

        additional_dependencies:
          - pytest
          - pyyaml
          - flask
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)


   # 4) Secret scan staged
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: "gitleaks (staged)"
        entry: bash -lc "gitleaks protect --staged --redact --verbose --config .gitleaks.toml"
        language: system


    # 5) Custom rules (team)
  - repo: local
    hooks:
      - id: check-no-print
        name: "custom: forbid print() in production"
        entry: python tools/local-gate/check_no_print.py --config tools/local-gate/rules.yaml
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        types: [python]
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)

      - id: check-max-nested
        name: "custom: không quá 3 mức if/for/while lồng"
        entry: python tools/local-gate/check_max_nested.py
        language: python
        types: [python]
        exclude: "tests/|tools/local-gate/"
        args: ["--config=tools/local-gate/rules.yaml", "--max-depth=2"]  # ← THÊM
 
  # - repo: local
  #   hooks:
  #     - id: pytest-pre-push
  #       name: "pytest (unit) - pre-push gate"
  #       entry: bash -lc "python3 -m pytest -q --tb=short"
  #       language: system
  #       pass_filenames: false
  #       stages: [pre-push]

  - repo: local
    hooks:
      - id: pytest-pre-push
        name: "Smart pytest - tự động tìm app"
        entry: bash -c '
          echo "=== TỰ ĐỘNG KIỂM TRA TESTS ==="
          
          # Tìm tất cả folder có tests/
          ALL_APPS=$(find . -maxdepth 2 -type d -name "tests" -not -path "./.*" 2>/dev/null | sed "s|/tests||" | sed "s|^./||")
          
          if [ -z "$ALL_APPS" ]; then
            echo "✅ Không tìm thấy thư mục tests nào"
            exit 0
          fi
          
          echo "📁 Tìm thấy app: $ALL_APPS"
          
          # Kiểm tra từng app có thay đổi không
          APPS_TO_TEST=""
          for APP in $ALL_APPS; do
            if git diff --name-only origin/main...HEAD 2>/dev/null | grep -q "^$APP/"; then
              APPS_TO_TEST="$APPS_TO_TEST $APP"
              echo "  → $APP có thay đổi"
            fi
          done
          
          if [ -z "$APPS_TO_TEST" ]; then
            echo "✅ Không có app nào thay đổi"
            exit 0
          fi
          
          echo "🚀 Chạy test cho: $APPS_TO_TEST"
          
          # Chạy test
          for APP in $APPS_TO_TEST; do
            echo ""
            echo "🧪 Testing $APP..."
            python3 -m pytest "$APP/tests/" -q --tb=short
            if [ $? -ne 0 ]; then
              echo "❌ $APP: Test failed"
              exit 1
            fi
          done
          
          echo "✅ Tất cả tests passed!"
        '
        language: system
        pass_filenames: false
        stages: [pre-push]