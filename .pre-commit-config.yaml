default_stages: [pre-commit]

repos:
  # 1) Formatter check-only: YAPF
  - repo: local
    hooks:
      - id: yapf-check
        name: "yapf: check format (no auto-fix)"
        entry: yapf --diff --style .style.yapf
        language: python
        additional_dependencies: ["yapf==0.43.0"]
        types: [python]
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)

  # 2) Linter: Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff

    # 3) Logic basic: Pylint maintainability gate (low-noise)
  - repo: https://github.com/pycqa/pylint
    rev: v3.2.7
    hooks:
      - id: pylint
        args:
          # để pylint import được module trong repo (ví dụ: apps.demo_yapf)
          - "--init-hook=import sys; sys.path.insert(0, '.')"
          # chỉ bật các rule cần (giảm noise)
          - "--disable=all"
          - "--enable=R1702,R0912,R0915,E,F"
          # thresholds (tune theo team)
          - "--max-nested-blocks=5"
          - "--max-branches=12"
          - "--max-statements=50"
        additional_dependencies:
          # để pylint không báo import-error khi quét tests/ và tools/
          - pytest
          - pyyaml
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)

  # - repo: local
  #   hooks:
  #     - id: pylint-warning
  #       name: "pylint (warning only)"
  #       entry: bash -lc "pylint --disable=all --enable=R1702,R0912,R0915,E,F --max-nested-blocks=5 --max-branches=12 --max-statements=50 $(git ls-files '*.py'); exit 0"
  #       language: system
  #       pass_filenames: false



  # 4) Secret scan staged
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: "gitleaks (staged)"
        entry: bash -lc "gitleaks protect --staged --redact --verbose"
        language: system

 
  # 6) Pre-push: run pytest (unit only)
  - repo: local
    hooks:
      - id: pytest-pre-push
        name: "pytest (unit) - pre-push gate"
        entry: bash -lc "python3 -m pytest tests/unit -m 'not slow' -q --tb=short"
        language: system
        pass_filenames: false
        stages: [pre-push]
