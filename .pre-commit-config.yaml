default_stages: [pre-commit]

repos:
  # 1) Formatter check-only: YAPF
  - repo: local
    hooks:
      - id: yapf-check
        name: "yapf: check format (no auto-fix)"
        entry: yapf --diff --style .style.yapf
        language: python
        additional_dependencies: ["yapf==0.43.0"]
        types: [python]
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)

  # 2) Linter: Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
    
     # 3) Logic basic: Pylint nested blocks
  - repo: https://github.com/pycqa/pylint
    rev: v3.2.7
    hooks:
      - id: pylint
        args:
          - "--init-hook=import sys; sys.path.insert(0, '.')"
          - "--disable=all"
          - "--enable=R1702,R0912,R0915,E,F"
          - "--max-nested-blocks=5"
          - "--max-branches=12"
          - "--max-statements=50"

        additional_dependencies:
          - pytest
          - pyyaml
          - flask
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)


   # 4) Secret scan staged
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: "gitleaks (staged)"
        entry: bash -lc "gitleaks protect --staged --redact --verbose --config .gitleaks.toml"
        language: system


    # 5) Custom rules (team)
  - repo: local
    hooks:
      - id: check-no-print
        name: "custom: forbid print() in production"
        entry: python tools/local-gate/check_no_print.py --config tools/local-gate/rules.yaml
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        types: [python]
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)

      - id: check-max-nested
        name: "custom: không quá 3 mức if/for/while lồng"
        entry: python tools/local-gate/check_max_nested.py
        language: python
        types: [python]
        exclude: "tests/|tools/local-gate/"
        args: ["--config=tools/local-gate/rules.yaml", "--max-depth=2"]  # ← THÊM


  # 6) Unit test pre-push (nếu muốn)
  - repo: local
    hooks:
      - id: pytest-pre-push
        name: "🧪 pytest - VERBOSE output"
        entry: |
          echo "=== SMART TEST DETECTOR (VERBOSE) ==="
          echo ""
          
          # 1. Lấy file thay đổi
          FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null)
          echo "📊 Git diff output:"
          if [ -z "$FILES" ]; then
            echo "  (empty - no files changed)"
          else
            echo "$FILES" | sed 's/^/  /'
          fi
          echo ""
          
          # 2. Lấy apps
          APPS=$(echo "$FILES" | cut -d'/' -f1 | sort -u)
          echo "📁 Apps detected:"
          if [ -z "$APPS" ]; then
            echo "  (no apps detected)"
          else
            echo "  $APPS"
          fi
          echo ""
          
          # 3. Tìm test files
          TEST_PATHS=""
          FOUND_TESTS=0
          
          for APP in $APPS; do
            echo "🔍 Scanning $APP..."
            
            # Pattern 1: test_*.py trong app
            TESTS=$(ls $APP/test_*.py 2>/dev/null | wc -l)
            if [ $TESTS -gt 0 ]; then
              echo "  ✅ Found $TESTS test_*.py files"
              TEST_PATHS="$TEST_PATHS $APP/test_*.py"
              FOUND_TESTS=1
            fi
            
            # Pattern 2: tests folder
            if [ -d "$APP/tests" ]; then
              echo "  ✅ Found tests/ folder"
              TEST_PATHS="$TEST_PATHS $APP/tests"
              FOUND_TESTS=1
            fi
          done
          
          echo ""
          
          # 4. Chạy tests nếu có
          if [ $FOUND_TESTS -eq 0 ]; then
            echo "⚠️  No test files found in changed apps"
            echo "✅ Hook passed (nothing to test)"
            exit 0
          fi
          
          echo "🚀 Test paths to run:"
          echo "  $TEST_PATHS"
          echo ""
          echo "=== RUNNING PYTEST ==="
          
          # Chạy pytest với output đầy đủ
          python3 -m pytest $TEST_PATHS -v --tb=short --disable-warnings
          
          EXIT_CODE=$?
          echo ""
          echo "=== PYTEST EXIT CODE: $EXIT_CODE ==="
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "🎉 ALL TESTS PASSED!"
          else
            echo "❌ TESTS FAILED!"
          fi
          
          exit $EXIT_CODE
        language: system
        pass_filenames: false
        stages: [pre-push]
 
