default_stages: [pre-commit]

repos:
  # 1) Formatter check-only: YAPF
  - repo: local
    hooks:
      - id: yapf-check
        name: "yapf: check format (no auto-fix)"
        entry: yapf --diff --style .style.yapf
        language: python
        additional_dependencies: ["yapf==0.43.0"]
        types: [python]
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)

  # 2) Linter: Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
    
     # 3) Logic basic: Pylint nested blocks
  - repo: https://github.com/pycqa/pylint
    rev: v3.2.7
    hooks:
      - id: pylint
        args:
          - "--init-hook=import sys; sys.path.insert(0, '.')"
          - "--disable=all"
          - "--enable=R1702,R0912,R0915,E,F"
          - "--max-nested-blocks=5"
          - "--max-branches=12"
          - "--max-statements=50"

        additional_dependencies:
          - pytest
          - pyyaml
          - flask
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)


   # 4) Secret scan staged
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: "gitleaks (staged)"
        entry: bash -lc "gitleaks protect --staged --redact --verbose --config .gitleaks.toml"
        language: system


    # 5) Custom rules (team)
  - repo: local
    hooks:
      - id: check-no-print
        name: "custom: forbid print() in production"
        entry: python tools/local-gate/check_no_print.py --config tools/local-gate/rules.yaml
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        types: [python]
        exclude: ^(.*\/migrations\/|static\/|media\/|dist\/|build\/)

      - id: check-max-nested
        name: "custom: không quá 3 mức if/for/while lồng"
        entry: python tools/local-gate/check_max_nested.py
        language: python
        types: [python]
        exclude: "tests/|tools/local-gate/"
        args: ["--config=tools/local-gate/rules.yaml", "--max-depth=2"]  # ← THÊM


  # 6) Unit test pre-push (nếu muốn)
 - repo: local
    hooks:
      - id: pytest-pre-push
        name: "pytest - hỗ trợ cả 2 loại test"
        entry: |
          echo "=== SMART TEST DETECTOR ==="
          
          # Lấy app từ file thay đổi
          APPS=$(git diff --name-only origin/main...HEAD 2>/dev/null | cut -d'/' -f1 | sort -u)
          
          if [ -z "$APPS" ]; then
            echo "✅ Không có app nào thay đổi"
            exit 0
          fi
          
          echo "📁 Apps có thay đổi: $APPS"
          echo ""
          
          # Biến để lưu test files/paths
          TEST_PATHS=""
          
          for APP in $APPS; do
            echo "🔍 Kiểm tra $APP..."
            
            # TRƯỜNG HỢP 1: test_*.py trong app folder (của bạn)
            if compgen -G "$APP/test_*.py" > /dev/null; then
              echo "  ✓ Tìm thấy test_*.py trong $APP/"
              TEST_PATHS="$TEST_PATHS $APP/test_*.py"
            fi
            
            # TRƯỜNG HỢP 2: *_test.py trong app folder
            if compgen -G "$APP/*_test.py" > /dev/null; then
              echo "  ✓ Tìm thấy *_test.py trong $APP/"
              TEST_PATHS="$TEST_PATHS $APP/*_test.py"
            fi
            
            # TRƯỜNG HỢP 3: tests/ folder với test files
            if [ -d "$APP/tests" ]; then
              echo "  ✓ Tìm thấy folder $APP/tests/"
              TEST_PATHS="$TEST_PATHS $APP/tests/"
            fi
            
            # TRƯỜNG HỢP 4: tests/test_*.py trong folder tests
            if compgen -G "$APP/tests/test_*.py" > /dev/null; then
              echo "  ✓ Tìm thấy test_*.py trong $APP/tests/"
              TEST_PATHS="$TEST_PATHS $APP/tests/test_*.py"
            fi
          done
          
          if [ -z "$TEST_PATHS" ]; then
            echo "⚠️  Không tìm thấy test files nào"
            exit 0
          fi
          
          echo ""
          echo "🚀 Chạy tests..."
          echo "Paths: $TEST_PATHS"
          echo ""
          
          # Chạy pytest cho tất cả test paths
          python3 -m pytest $TEST_PATHS -v --tb=short
          
          if [ $? -eq 0 ]; then
            echo ""
            echo "✅ TẤT CẢ TESTS PASSED!"
            exit 0
          else
            echo ""
            echo "❌ CÓ TESTS FAILED"
            exit 1
          fi
        language: system
        pass_filenames: false
        stages: [pre-push]
 
