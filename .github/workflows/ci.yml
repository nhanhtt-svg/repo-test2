name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yapf==0.43.0 ruff==0.6.9 pylint pytest pyyaml gitleaks

      # 1) Formatter check-only: YAPF
      - name: YAPF check format
        run: yapf --diff --style .style.yapf $(find . -name "*.py" -not -path "./migrations/*" -not -path "./static/*" -not -path "./media/*" -not -path "./dist/*" -not -path "./build/*")

      # 2) Linter: Ruff
      - name: Ruff lint
        run: ruff check .

      # 3) Pylint basic logic
      - name: Pylint check
        run: pylint --init-hook="import sys; sys.path.insert(0, '.')" \
                    --disable=all \
                    --enable=R1702,R0912,R0915,E,F \
                    --max-nested-blocks=5 \
                    --max-branches=12 \
                    --max-statements=50 \
                    $(find . -name "*.py" -not -path "./migrations/*" -not -path "./static/*" -not -path "./media/*" -not -path "./dist/*" -not -path "./build/*")

      # 4) Secret scan: gitleaks
      - name: Gitleaks scan
        run: gitleaks detect --redact --verbose --config .gitleaks.toml

      # 5) Unit tests
      - name: Run pytest
        run: pytest -q --tb=short
