[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "**/migrations/**",
  "static/**",
  "media/**",
  "dist/**",
  "build/**",
]

[tool.ruff.format]
# mặc định ok, có thể giữ trống

[tool.ruff.lint]
select = ["E4","E7","E9","W","F","I","B","C90"]
ignore = ["E501"]
# Complexity gate (C901)
mccabe.max-complexity = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: slow tests"
]
[tool.poetry.dependencies]
django = "2.2.10"